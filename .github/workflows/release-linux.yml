# Builds Forge for Linux (AppImage and .deb) on Ubuntu and attaches them to a
# GitHub release. node-pty (the terminal) has no Linux prebuild, so it must be
# compiled on Linux: that's why this runs here and not on the Windows machine.
#
# Runs by itself when a release is published, or by hand (Actions → Release
# Linux → Run workflow) for an existing tag.
name: Release Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v0.46.1)
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compile native modules (node-pty) for this Electron.
      - run: npx electron-builder install-app-deps
      - run: npx electron-vite build
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.AppImage release/*.deb release/latest-linux.yml --clobber --repo "$GITHUB_REPOSITORY"
