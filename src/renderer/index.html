<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>IDEforfun</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <button id="open-folder">Open Folder</button>
      <span id="folder-name" class="muted">No folder open</span>
      <span class="spacer"></span>
      <button id="run-file" class="secondary" title="Run current Python file (F5)">▶ Run</button>
      <button id="stop-run" class="secondary" title="Stop (Shift+F5)">■ Stop</button>
      <button id="open-settings" class="secondary icon" title="Settings (Ctrl+,)" aria-label="Settings">⚙</button>
    </header>
    <div id="workspace">
      <aside id="sidebar">
        <div id="sidebar-tabs" role="tablist" aria-label="Sidebar">
          <button role="tab" data-view="files" aria-selected="true" title="Files">Files</button>
          <button role="tab" data-view="search" aria-selected="false" title="Search in project (Ctrl+Shift+F)">Search</button>
        </div>
        <div id="file-tree" class="sidebar-view"></div>
        <div id="search-panel" class="sidebar-view" hidden></div>
      </aside>
      <main id="editor-pane">
        <div id="tabs" role="tablist"></div>
        <div id="editor"></div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
